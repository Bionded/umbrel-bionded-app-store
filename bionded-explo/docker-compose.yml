version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-explo_server_1
      APP_PORT: 7288

  server:
    image: ghcr.io/lumepart/explo:v1.2.0@sha256:680eac0592d013aac8768e2c3bae02345f74083f3a4585337420446764eb66fc
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEB_UI=true
      - WEB_ENV_PATH=/opt/explo/config/.env
      - UI_USERNAME=explo
      - UI_PASSWORD=${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/explo/config
      - ${UMBREL_ROOT}/data/storage/downloads/explo:/data
      - ${UMBREL_ROOT}/data/storage/downloads/slskd/complete:/slskd
      - ${UMBREL_ROOT}/data/storage/Music:/music:ro
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
