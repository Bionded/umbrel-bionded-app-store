  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-aurral/gallery-1.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-aurral/gallery-2.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-aurral/gallery-3.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-aurral/gallery-4.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-aurral/gallery-5.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
folderAccess:
  - id: music
    name: Music
    note: Your music library (the same folder Lidarr manages). Available inside Aurral at /music.
    mounts:
      - service: server
        targetPath: /music
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  Update to 2.11.0.


  Highlights:
    - 2.11.0 is a big one. Aurral can now manage your music without Lidarr, the player and mobile experience have had a major overhaul, and you can share music…
    - Lidarr is optional. Aurral can monitor artists, download albums and individual tracks, and manage their files itself. Existing Lidarr setups still work, and…
    - Bring your existing music into Aurral with Settings > Library files > Import a folder. Copy, move, or hardlink files into the Downloads Folder, fill in…
    - Choose what a monitored artist downloads with Settings > Monitoring or an artist's Monitoring rules… menu. Rules cover back catalogue, new releases, release…


  Full release notes: https://github.com/lklynet/aurral/releases/tag/v2.11.0
