version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-aurral_server_1
      APP_PORT: 3001
      PROXY_AUTH_WHITELIST: "/rest/*"

  server:
    image: ghcr.io/lklynet/aurral:3.1.0@sha256:17d1f8ff2aaa3907d846c38b47eebdd44b10fbe00b2c993373a6da940ac2504f
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOWNLOAD_FOLDER=/downloads/aurral
      - FILE_BROWSE_ROOTS=/music,/downloads,/config
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
