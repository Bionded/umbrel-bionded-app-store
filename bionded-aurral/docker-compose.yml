version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-aurral_server_1
      APP_PORT: 3001
      PROXY_AUTH_WHITELIST: "/rest/*"

  server:
    image: ghcr.io/lklynet/aurral:2.11.0@sha256:a772c2d6c35dd9dd90128cf350bfc35b37bdd3c59ab5810374b7aa1a4063855c
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOWNLOAD_FOLDER=/downloads/aurral
      - FILE_BROWSE_ROOTS=/music,/downloads,/config
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
