version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-aurral_server_1
      APP_PORT: 3001
      PROXY_AUTH_WHITELIST: "/rest/*"

  server:
    image: ghcr.io/lklynet/aurral:3.0.1@sha256:dfca50e61cfdea54506c9836431a3c6b526873e0650f4a348a4a032a1324b7dc
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOWNLOAD_FOLDER=/downloads/aurral
      - FILE_BROWSE_ROOTS=/music,/downloads,/config
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
