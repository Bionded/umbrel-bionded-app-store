version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-aurral_server_1
      APP_PORT: 3001
      PROXY_AUTH_WHITELIST: "/rest/*"

  server:
    image: ghcr.io/lklynet/aurral:2.13.0@sha256:75dd06805e3daefd49eb4f91d19f4110f0ef6eb1d2b13e48ae36120d113b48f0
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOWNLOAD_FOLDER=/downloads/aurral
      - FILE_BROWSE_ROOTS=/music,/downloads,/config
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
