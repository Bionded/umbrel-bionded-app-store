manifestVersion: 1.1
id: bionded-lidarr-nightly
storage:
  dataRoot: data
category: media
name: Lidarr Nightly
tagline: Plugin-ready Lidarr nightly that runs alongside the official Lidarr
version: "3.1.6.5102-nightly.20261014-patch.2"
port: 8687
description: >-
  Lidarr is a music collection manager: it monitors your artists, finds new and
  missing albums, sends them to a download client and imports, tags and renames
  the results into a clean Artist/Album library.


  This is the nightly (develop) build of Lidarr, the only build with the plugin
  system. Plugins such as Tubifarry add Soulseek (slskd), YouTube, Deezer and
  Lucida as indexers and download clients, plus lyrics and metadata tools. It
  has its own app id, port (8687) and data folder, so it installs next to the
  official Lidarr from the Umbrel App Store without touching it. Nightly builds
  can contain bugs, so back up before big updates.


  🎵 HOW IT WORKS WITH THE OTHER MUSIC APPS

  Lidarr Nightly is the library manager. It is the only app that writes to your
  music library (Home → Music, /music in every app). Downloaders (slskd, Aurral,
  SoulSync, Explo) write to Home → Downloads → <app>, and Lidarr imports
  albums from there into /music. Aurral sends album and artist requests here,
  and Navidrome streams the result.


  🛠️ FIRST-RUN SETUP

  1. Open the app and pick a login (Settings → General → Authentication → Forms).

  2. Settings → Media Management → Root Folders → add /music.

  3. System → Plugins → paste https://github.com/TypNull/Tubifarry → Install, then
  restart the app from umbrelOS.

  4. Settings → Download Clients → + → Slskd (Tubifarry): URL
  http://bionded-slskd_server_1:5030, API key = an API key you add in slskd (Options → web → authentication → api_keys). Lidarr picks up slskd's finished files at
  /downloads/slskd/complete automatically. slskd must be logged in to
  Soulseek before Lidarr accepts the client.

  5. For Tubifarry's other downloaders (YouTube, Deezer…) use the download path
  /downloads/lidarr.


  🔑 API KEY

  Other apps (Aurral, Explo) need Lidarr's API key: Settings → General → Security
  → API Key. Address from other apps: http://bionded-lidarr-nightly_server_1:8686


  Works on amd64 and arm64.
developer: Lidarr
website: https://lidarr.audio/
dependencies: []
repo: https://github.com/Lidarr/Lidarr
support: https://github.com/Lidarr/Lidarr/issues
