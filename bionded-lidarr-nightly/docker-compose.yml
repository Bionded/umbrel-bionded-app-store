version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-lidarr-nightly_server_1
      APP_PORT: 8686
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: linuxserver/lidarr:nightly-3.1.6.5102-ls221@sha256:901e31858139a4b099e615e736c588aadaf5560c531d223308cf17872d8bb345
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
