version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-lidarr-nightly_server_1
      APP_PORT: 8686
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: linuxserver/lidarr:nightly-4.0.0.5247-ls230@sha256:0db4488f80216a822949a1f4a85f10bb27d742003a61398f0252f4ae3a03a891
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
