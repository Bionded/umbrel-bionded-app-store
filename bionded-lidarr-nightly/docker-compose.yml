version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-lidarr-nightly_server_1
      APP_PORT: 8686
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: linuxserver/lidarr:nightly-3.2.0.5144-ls222@sha256:46d21f67ed1d347793c19d198cd2172db7372343acbb0ce68fe06882111409c4
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
