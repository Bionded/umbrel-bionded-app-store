manifestVersion: 1
id: bionded-koito
storage:
  dataRoot: data
category: media
name: Koito
tagline: Private, ListenBrainz-compatible scrobbler with beautiful listening stats
version: "0.3.2"
port: 4110
description: >-
  Koito is a self-hosted scrobbler. Anything that can scrobble to ListenBrainz
  can send plays to Koito, and Koito turns them into themeable stats: top
  artists, albums and tracks, listening activity, yearly "rewind" pages and
  more. You can import history from ListenBrainz, Last.fm, Maloja and Spotify.


  ⚠️ Koito is young software and its author warns it may still change in
  breaking ways. This app is pinned to a tested version and is never updated
  automatically; check the release notes before updating, and keep backups.


  🎵 HOW IT WORKS WITH THE OTHER MUSIC APPS

  Koito stores your private listening history. Multi-Scrobbler sends it every
  play from Navidrome, and Aurral can read your Koito history for
  recommendations.


  🛠️ FIRST-RUN SETUP

  1. Open the app, press the settings icon (bottom left) and sign in as admin with the
  password umbrelOS shows for this app. Change the password if you like.

  2. Settings → API Keys: copy the API key (click the key itself to select it;
  the copy button needs HTTPS).

  3. Use that key as the token in Multi-Scrobbler (KOITO_TOKEN) or any
  ListenBrainz-compatible scrobbler.


  🔌 LISTENBRAINZ ENDPOINT

  From other apps: http://bionded-koito_server_1:4110/apis/listenbrainz/1

  From your phone or PC: http://umbrel.local:4110/apis/listenbrainz/1 (this path
  is open without the Umbrel login and uses the Koito API key).


  Works on amd64 and arm64.
