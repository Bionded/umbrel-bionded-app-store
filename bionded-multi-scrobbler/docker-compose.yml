version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-multi-scrobbler_server_1
      APP_PORT: 9078
      PROXY_AUTH_WHITELIST: "/api/listenbrainz*,/api/lastfm*,/2.0*,/1/*"

  server:
    image: foxxmd/multi-scrobbler:0.19.2@sha256:449274cb8b5b855cc361056862aed6a11e5dcc0a72e2acb279ac78edf834a1c7
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - BASE_URL=http://${DEVICE_DOMAIN_NAME}:9078
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
