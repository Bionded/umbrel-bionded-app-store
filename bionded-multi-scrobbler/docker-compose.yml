version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-multi-scrobbler_server_1
      APP_PORT: 9078
      PROXY_AUTH_WHITELIST: "/api/listenbrainz*,/api/lastfm*,/2.0*,/1/*"

  server:
    image: foxxmd/multi-scrobbler:0.21.2@sha256:a8ff2d0ae1dc6984fea0481863f29a9647a8f5b705f6e44cbf6791e0c0fb88e5
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - BASE_URL=http://${DEVICE_DOMAIN_NAME}:9078
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
