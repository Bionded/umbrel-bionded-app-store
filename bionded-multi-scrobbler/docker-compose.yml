version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-multi-scrobbler_server_1
      APP_PORT: 9078
      PROXY_AUTH_WHITELIST: "/api/listenbrainz*,/api/lastfm*,/2.0*,/1/*"

  server:
    image: foxxmd/multi-scrobbler:0.20.2@sha256:1e3e90ffcdb163a8e84f835b5d83978d30ceb54e457d7447c1de020ab867d898
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - BASE_URL=http://${DEVICE_DOMAIN_NAME}:9078
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
