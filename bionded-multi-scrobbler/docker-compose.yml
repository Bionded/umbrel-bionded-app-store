version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-multi-scrobbler_server_1
      APP_PORT: 9078
      PROXY_AUTH_WHITELIST: "/api/listenbrainz*,/api/lastfm*,/2.0*,/1/*"

  server:
    image: foxxmd/multi-scrobbler:0.21.0@sha256:d3dacd94c5e6629d9a01579c2e4484de9440c1755dcbaae2ffb50d19b18793a0
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - BASE_URL=http://${DEVICE_DOMAIN_NAME}:9078
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
