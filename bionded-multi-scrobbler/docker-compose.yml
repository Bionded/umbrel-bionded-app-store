version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-multi-scrobbler_server_1
      APP_PORT: 9078
      PROXY_AUTH_WHITELIST: "/api/listenbrainz*,/api/lastfm*,/2.0*,/1/*"

  server:
    image: foxxmd/multi-scrobbler:0.21.3@sha256:73f8aa6cf475f841e0d21ffc191f66e74ac8e6d652c68b9dd187b65aedbb5395
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - BASE_URL=http://${DEVICE_DOMAIN_NAME}:9078
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
