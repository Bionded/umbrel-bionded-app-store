manifestVersion: 1
id: bionded-multi-scrobbler
storage:
  dataRoot: data
category: media
name: Multi-Scrobbler
tagline: Collect plays from every player and scrobble them everywhere
version: "0.20.2-patch.2"
port: 9078
description: >-
  Multi-Scrobbler watches what you play on Navidrome and other Subsonic servers,
  Jellyfin, Plex, Spotify, YouTube Music, Kodi, MPD, Chromecast and more. It
  sends every play to the scrobblers you choose: Koito, ListenBrainz, Last.fm,
  Maloja, Libre.fm and others. It removes duplicates, can fix and normalise
  metadata, and shows everything on a live dashboard.


  🎵 HOW IT WORKS WITH THE OTHER MUSIC APPS

  Multi-Scrobbler is the listening-history router. It reads your plays from
  Navidrome and sends them to Koito and/or Maloja (your private stats) and, if
  you like, ListenBrainz. That ListenBrainz history is what Explo and Aurral use for
  recommendations.


  🛠️ FIRST-RUN SETUP (⋯ → Settings → Advanced settings, then restart)

  1. Navidrome source, either:

  a) Recommended, catches every play (also offline or late ones): set LZE_ID
  (e.g. navidrome_lz) and LZE_TOKEN (any string). In Navidrome add the custom
  environment variable ND_LISTENBRAINZ_BASEURL =
  http://bionded-multi-scrobbler_server_1:9078/1/ and, under your Navidrome
  profile, enable ListenBrainz with that same token.

  b) Polling: SUBSONIC_ID (any name, e.g. navidrome), SUBSONIC_URL (preset
  http://navidrome_server_1:4533), SUBSONIC_USER and SUBSONIC_PASSWORD. This
  only sees tracks a player reports as "now playing". Don't use a) and b) for
  the same plays.

  2. Koito client: KOITO_ID (e.g. koito), KOITO_URL
  (http://bionded-koito_server_1:4110), KOITO_USER (Koito username) and
  KOITO_TOKEN (Koito → Settings → API Keys).

  3. Maloja client: MALOJA_ID (e.g. maloja), MALOJA_URL
  (http://bionded-maloja_server_1:42010) and MALOJA_API_KEY (the Maloja app
  password shown by umbrelOS, or a key from Maloja → Admin → API Keys).

  4. Other scrobblers (ListenBrainz LZ_*, Last.fm LASTFM_*, Libre.fm LIBREFM_*,
  Rocksky ROCKSKY_*, teal.fm TEALFM_*, Discord DISCORD_*, Tuneshine TUNE_*) are
  all listed in Advanced settings and start empty. A client is enabled once
  its _ID and required fields are set. Between apps on this Umbrel, always use
  the internal addresses above, not umbrel.local or the IP: those go through
  the Umbrel login.

  5. Open the dashboard and check that every source and client is green.
  Advanced setups (several users, Spotify or Last.fm sources) use JSON files in
  the app's config folder; see docs.multi-scrobbler.app.


  The dashboard is protected by your Umbrel login. Scrobble endpoints for apps
  that send plays to Multi-Scrobbler (ListenBrainz/Last.fm compatible) are open
  at http://umbrel.local:9078.


  Works on amd64 and arm64.
developer: FoxxMD
website: https://docs.multi-scrobbler.app/
dependencies: []
repo: https://github.com/FoxxMD/multi-scrobbler
support: https://github.com/FoxxMD/multi-scrobbler/issues
icon: https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-multi-scrobbler/icon.png
gallery:
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-multi-scrobbler/gallery-1.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-multi-scrobbler/gallery-2.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-multi-scrobbler/gallery-3.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-multi-scrobbler/gallery-4.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
environment:
  - name: SUBSONIC_ID
    services:
      - server
    default: navidrome
    note: Name for the Navidrome/Subsonic source. Setting it (with URL, user and password) enables the source.
  - name: SUBSONIC_URL
    services:
      - server
    default: http://navidrome_server_1:4533
    note: Address of Navidrome (or another Subsonic server) as seen from this app.
  - name: SUBSONIC_USER
    services:
      - server
    note: Navidrome username whose plays are scrobbled.
  - name: SUBSONIC_PASSWORD
    services:
      - server
    note: Password of that Navidrome user.
  - name: SUBSONIC_NAME
    services:
      - server
    note: "Navidrome source: optional display name (defaults to SUBSONIC_ID)."
  - name: SUBSONIC_ENABLE
    services:
      - server
    note: "Navidrome source: optional true/false (default true). Set false when Navidrome forwards plays through the ListenBrainz endpoint (LZE_*) instead."
  - name: LZE_ID
    services:
      - server
    note: "ListenBrainz endpoint source: unique name, e.g. navidrome_lz. Lets Navidrome and other players send plays here as if this app were ListenBrainz (base URL http://bionded-multi-scrobbler_server_1:9078/1/)."
  - name: LZE_NAME
    services:
      - server
    note: "ListenBrainz endpoint source: optional display name (defaults to LZE_ID)."
  - name: LZE_ENABLE
    services:
      - server
    note: "ListenBrainz endpoint source: optional true/false (default true)."
  - name: LZE_TOKEN
    services:
      - server
    note: "ListenBrainz endpoint source: any token you choose; use the same token as the ListenBrainz token in the sending player (e.g. Navidrome)."
  - name: LZE_USERNAME
    services:
      - server
    note: "ListenBrainz endpoint source: optional ListenBrainz username to report for this source."
  - name: LZE_SLUG
    services:
      - server
    note: "ListenBrainz endpoint source: optional custom path (/api/listenbrainz/<slug>) for several sources without tokens."
  - name: LZE_EXTRACT_ARTISTS
    services:
      - server
    note: "ListenBrainz endpoint source: optional true/false (default true); split comma-separated artists."
  - name: KOITO_ID
    services:
      - server
    note: "Koito client: unique name, e.g. koito. Setting it (with URL, user and token) enables scrobbling to Koito."
  - name: KOITO_NAME
    services:
      - server
    note: "Koito client: optional display name (defaults to KOITO_ID)."
  - name: KOITO_ENABLE
    services:
      - server
    note: "Koito client: optional true/false (default true)."
  - name: KOITO_URL
    services:
      - server
    note: "Koito client: base address as seen from this app (no /apis path), e.g. http://bionded-koito_server_1:4110."
  - name: KOITO_USER
    services:
      - server
    note: "Koito client: your Koito username."
  - name: KOITO_TOKEN
    services:
      - server
    note: "Koito client: Koito API key (Koito → Settings → API Keys)."
  - name: KOITO_ALLOW_DEVICE_LIST
    services:
      - server
    note: "Koito client: optional comma-separated match:label list used as media_play when none is sent."
  - name: MALOJA_ID
    services:
      - server
    note: "Maloja client: unique name, e.g. maloja. Setting it (with URL and API key) enables scrobbling to Maloja."
  - name: MALOJA_NAME
    services:
      - server
    note: "Maloja client: optional display name (defaults to MALOJA_ID)."
  - name: MALOJA_ENABLE
    services:
      - server
    note: "Maloja client: optional true/false (default true)."
  - name: MALOJA_URL
    services:
      - server
    note: "Maloja client: base address as seen from this app, e.g. http://bionded-maloja_server_1:42010."
  - name: MALOJA_API_KEY
    services:
      - server
    note: "Maloja client: API key (the Maloja app password, or Maloja → Admin → API Keys)."
  - name: LZ_ID
    services:
      - server
    note: "ListenBrainz client: unique name, e.g. listenbrainz. Setting it (with token and user) enables scrobbling to ListenBrainz."
  - name: LZ_NAME
    services:
      - server
    note: "ListenBrainz client: optional display name (defaults to LZ_ID)."
  - name: LZ_ENABLE
    services:
      - server
    note: "ListenBrainz client: optional true/false (default true)."
  - name: LZ_URL
    services:
      - server
    note: "ListenBrainz client: optional server URL if not listenbrainz.org (default https://api.listenbrainz.org/)."
  - name: LZ_TOKEN
    services:
      - server
    note: "ListenBrainz client: user token (listenbrainz.org → Settings → User token)."
  - name: LZ_USER
    services:
      - server
    note: "ListenBrainz client: your ListenBrainz username."
  - name: LZ_CONTACT
    services:
      - server
    note: "ListenBrainz client: optional contact website or email (only for forked builds)."
  - name: LZ_ALLOW_DEVICE_LIST
    services:
      - server
    note: "ListenBrainz client: optional comma-separated match:label list used as media_play when none is sent."
  - name: LASTFM_ID
    services:
      - server
    note: "Last.fm client: unique name, e.g. lastfm. Setting it (with API key and secret) enables scrobbling to Last.fm; then authorise it from the dashboard."
  - name: LASTFM_NAME
    services:
      - server
    note: "Last.fm client: optional display name (defaults to LASTFM_ID)."
  - name: LASTFM_ENABLE
    services:
      - server
    note: "Last.fm client: optional true/false (default true)."
  - name: LASTFM_API_KEY
    services:
      - server
    note: "Last.fm client: API key from last.fm/api/account/create."
  - name: LASTFM_SECRET
    services:
      - server
    note: "Last.fm client: shared secret from the same Last.fm API account."
  - name: LASTFM_REDIRECT_URI
    services:
      - server
    note: "Last.fm client: optional callback URL, e.g. http://umbrel.local:9078/lastfm/callback."
  - name: LASTFM_SESSION
    services:
      - server
    note: "Last.fm client: optional session id from a completed auth flow."
  - name: LIBREFM_ID
    services:
      - server
    note: "Libre.fm client: unique name, e.g. librefm. Setting it enables scrobbling to Libre.fm; then authorise it from the dashboard."
  - name: LIBREFM_NAME
    services:
      - server
    note: "Libre.fm client: optional display name (defaults to LIBREFM_ID)."
  - name: LIBREFM_ENABLE
    services:
      - server
    note: "Libre.fm client: optional true/false (default true)."
  - name: LIBREFM_API_KEY
    services:
      - server
    note: "Libre.fm client: optional API key."
  - name: LIBREFM_SECRET
    services:
      - server
    note: "Libre.fm client: optional secret."
  - name: LIBREFM_REDIRECT_URI
    services:
      - server
    note: "Libre.fm client: optional callback URL, e.g. http://umbrel.local:9078/librefm/callback."
  - name: LIBREFM_SESSION
    services:
      - server
    note: "Libre.fm client: optional session id from a completed auth flow."
  - name: LIBREFM_URLBASE
    services:
      - server
    note: "Libre.fm client: optional host and path of your instance (default https://libre.fm/2.0/)."
  - name: ROCKSKY_ID
    services:
      - server
    note: "Rocksky client: unique name, e.g. rocksky. Setting it (with handle) enables scrobbling to Rocksky."
  - name: ROCKSKY_NAME
    services:
      - server
    note: "Rocksky client: optional display name (defaults to ROCKSKY_ID)."
  - name: ROCKSKY_ENABLE
    services:
      - server
    note: "Rocksky client: optional true/false (default true)."
  - name: ROCKSKY_HANDLE
    services:
      - server
    note: "Rocksky client: fully-qualified Atmosphere (Bluesky) handle, e.g. you.bsky.social."
  - name: ROCKSKY_APP_PW
    services:
      - server
    note: "Rocksky client: App Password of your Atmosphere account."
  - name: ROCKSKY_TOKEN
    services:
      - server
    note: "Rocksky client: deprecated access token from rocksky.app/access-tokens."
  - name: TEALFM_ID
    services:
      - server
    note: "teal.fm client: unique name, e.g. tealfm. Setting it (with identifier and app password) enables scrobbling to teal.fm."
  - name: TEALFM_NAME
    services:
      - server
    note: "teal.fm client: optional display name (defaults to TEALFM_ID)."
  - name: TEALFM_ENABLE
    services:
      - server
    note: "teal.fm client: optional true/false (default true)."
  - name: TEALFM_IDENTIFIER
    services:
      - server
    note: "teal.fm client: fully-qualified Atmosphere (Bluesky) handle, e.g. you.bsky.social."
  - name: TEALFM_APP_PW
    services:
      - server
    note: "teal.fm client: App Password of your Atmosphere account."
  - name: DISCORD_ID
    services:
      - server
    note: "Discord client: unique name, e.g. discord. Setting it (with token) shows what you play as Discord status."
  - name: DISCORD_NAME
    services:
      - server
    note: "Discord client: optional display name (defaults to DISCORD_ID)."
  - name: DISCORD_ENABLE
    services:
      - server
    note: "Discord client: optional true/false (default true)."
  - name: DISCORD_TOKEN
    services:
      - server
    note: "Discord client: Discord user token."
  - name: DISCORD_APPLICATION_ID
    services:
      - server
    note: "Discord client: optional Discord application id."
  - name: DISCORD_ARTWORK
    services:
      - server
    note: "Discord client: optional artwork setting (true/false or allowed sources)."
  - name: DISCORD_ARTWORK_DEFAULT_URL
    services:
      - server
    note: "Discord client: optional fallback artwork URL."
  - name: DISCORD_IPC_LOCATIONS
    services:
      - server
    note: "Discord client: optional Discord IPC socket locations."
  - name: DISCORD_STATUS_OVERRIDE_ALLOW
    services:
      - server
    note: "Discord client: optional list of statuses that may be overridden."
  - name: DISCORD_LISTENING_ACTIVITY_ALLOW
    services:
      - server
    note: "Discord client: optional list of listening activities that may be overridden."
  - name: TUNE_ID
    services:
      - server
    note: "Tuneshine client: unique name, e.g. tuneshine. Setting it (with host) sends now-playing to a Tuneshine display."
  - name: TUNE_NAME
    services:
      - server
    note: "Tuneshine client: optional display name (defaults to TUNE_ID)."
  - name: TUNE_ENABLE
    services:
      - server
    note: "Tuneshine client: optional true/false (default true)."
  - name: TUNE_HOST
    services:
      - server
    note: "Tuneshine client: IP or http(s)://hostname of the Tuneshine device."
releaseNotes: >-
  Navidrome can now forward every play through Multi-Scrobbler's ListenBrainz
  endpoint (new LZE_* settings), which also catches offline and late plays.
  SUBSONIC_NAME and SUBSONIC_ENABLE were added for the polling source.


  All Multi-Scrobbler clients can now be set up from Advanced settings:
  Koito, Maloja, ListenBrainz, Last.fm, Libre.fm, Rocksky, teal.fm, Discord and
  Tuneshine, including their optional fields. Every client setting starts empty;
  the Koito and Maloja URLs are no longer prefilled (the internal addresses are
  in the description). Your saved settings are kept.

submitter: Bionded
