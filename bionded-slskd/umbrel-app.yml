manifestVersion: 1.1
id: bionded-slskd
storage:
  dataRoot: data
category: media
name: slskd
tagline: Soulseek client with a web UI and API for your music apps
version: "0.26.2"
port: 5032
description: >-
  slskd is a modern client for the Soulseek peer-to-peer network, with a web
  interface and a REST API. Search the network, browse other users' shares,
  queue downloads and share your own library from the browser.


  ⚠️ CONFIGURE SHARING OR YOU WILL BE BANNED

  Soulseek is a sharing community. Many users ban or refuse to upload to people
  who share nothing, and this app shares nothing until you set it up. Add a
  folder in Options → shares (only Home → Downloads is available inside slskd,
  at /downloads, e.g. /downloads/slskd/complete) or set SLSKD_SHARED_DIR in the
  app's settings, and leave upload slots enabled.


  🎵 HOW IT WORKS WITH THE OTHER MUSIC APPS

  slskd is the Soulseek download engine. Lidarr Nightly (via the Tubifarry
  plugin), Aurral, SoulSync and Explo all send requests to it through its API.
  Finished files land in Home → Downloads → slskd → complete
  (/downloads/slskd/complete). Each app then moves only the transfers it
  requested. This app uses its own folder and ports, so it can coexist with
  other slskd apps.


  🛠️ FIRST-RUN SETUP

  1. ⋯ → Settings → Advanced settings: enter SLSKD_SLSK_USERNAME and
  SLSKD_SLSK_PASSWORD (your Soulseek account; any new name and password
  registers a free account on first login). Restart the app.

  2. Sign in to the web UI with slskd / slskd and change the password under
  Options → web → authentication.

  3. For best speed and reachability, forward TCP port 50310 on your router to
  your Umbrel.


  🔑 API KEY FOR OTHER APPS

  Add a key under Options → web → authentication → api_keys (16+ characters)
  and paste it in Lidarr, Aurral, SoulSync or Explo. Address from other apps:
  http://bionded-slskd_server_1:5030 — download folder
  /downloads/slskd/complete.


  Works on amd64 and arm64.
developer: slskd
website: https://github.com/slskd/slskd
dependencies: []
repo: https://github.com/slskd/slskd
support: https://github.com/slskd/slskd/issues
icon: https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-slskd/icon.png
gallery:
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-slskd/gallery-1.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-slskd/gallery-2.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-bionded-app-store/master/bionded-slskd/gallery-3.jpg
path: ""
defaultUsername: "slskd"
defaultPassword: "slskd"
environment:
  - name: SLSKD_SLSK_USERNAME
    services:
      - server
    note: Your Soulseek network username. A new name registers a free account on first login. Without it slskd cannot connect.
  - name: SLSKD_SLSK_PASSWORD
    services:
      - server
    note: Your Soulseek network password.
  - name: SLSKD_SHARED_DIR
    services:
      - server
    default: /downloads/slskd/complete
    note: Folders shared with the network, semicolon-separated, as seen inside the container (Downloads is at /downloads). Share something or other users may ban you.
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  Update to 0.26.2.


  Highlights:
    - Suppress .DataProtection-Keys
    - Disable static asset mapping
    - Fix bug causing an error when a user requests their place in queue and more than one record for that user+file exists
    - Create app Mutex as explicitly session-only
    - Require explicit opt-in for run-time application memory dumps, adjust access level of several core API endpoints
    - fix: missing space in version update message


  Full release notes: https://github.com/slskd/slskd/releases/tag/0.26.2
submitter: Bionded
submission: https://github.com/Bionded/umbrel-bionded-app-store
