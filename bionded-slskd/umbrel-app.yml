manifestVersion: 1.1
id: bionded-slskd
storage:
  dataRoot: data
category: media
name: slskd
tagline: Soulseek client with a web UI and API for your music apps
version: "0.26.1"
port: 5032
description: >-
  slskd is a modern client for the Soulseek peer-to-peer network, with a web
  interface and a REST API. Search the network, browse other users' shares,
  queue downloads and share your own library from the browser.


  ⚠️ CONFIGURE SHARING OR YOU WILL BE BANNED

  Soulseek is a sharing community. Many users ban or refuse to upload to people
  who share nothing. By default this app shares your music library (Home →
  Music, read-only). Keep at least that shared, check Options → Shares in the
  web UI after the first scan, and leave upload slots enabled.


  🎵 WHERE IT FITS IN THE MUSIC STACK

  slskd is the Soulseek download engine. Lidarr Nightly (via the Tubifarry
  plugin), Aurral, SoulSync and Explo all send requests to it through its API.
  Finished files land in Home → Downloads → music → slskd → complete
  (/downloads/music/slskd/complete). Each app then moves only the transfers it
  requested. This app uses its own folder and ports, so it can coexist with
  other slskd apps.


  🛠️ FIRST-RUN SETUP

  1. ⋯ → Settings → Advanced settings: enter SLSKD_SLSK_USERNAME and
  SLSKD_SLSK_PASSWORD (your Soulseek account; any new name and password
  registers a free account on first login). Restart the app.

  2. Sign in to the web UI as slskd with the password umbrelOS shows for this
  app.

  3. For best speed and reachability, forward TCP port 50310 on your router to
  your Umbrel.


  🔑 API KEY FOR OTHER APPS

  The API key is the same as the web password umbrelOS shows for this app
  (unique to your Umbrel). Address from other apps:
  http://bionded-slskd_server_1:5030 — download folder
  /downloads/music/slskd/complete.


  Works on amd64 and arm64.
developer: slskd
website: https://github.com/slskd/slskd
dependencies: []
repo: https://github.com/slskd/slskd
support: https://github.com/slskd/slskd/issues
icon: https://raw.githubusercontent.com/Bionded/umbrel-music-app-store/master/bionded-slskd/icon.png
gallery:
  - https://raw.githubusercontent.com/Bionded/umbrel-music-app-store/master/bionded-slskd/gallery-1.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-music-app-store/master/bionded-slskd/gallery-2.jpg
  - https://raw.githubusercontent.com/Bionded/umbrel-music-app-store/master/bionded-slskd/gallery-3.jpg
path: ""
defaultUsername: "slskd"
deterministicPassword: true
folderAccess:
  - id: music
    name: Music
    note: Your music library, shared read-only with the Soulseek network at /music.
    mounts:
      - service: server
        targetPath: /music
        readOnly: true
environment:
  - name: SLSKD_SLSK_USERNAME
    services:
      - server
    note: Your Soulseek network username. A new name registers a free account on first login. Without it slskd cannot connect.
  - name: SLSKD_SLSK_PASSWORD
    services:
      - server
    note: Your Soulseek network password.
  - name: SLSKD_SHARED_DIR
    services:
      - server
    default: /music
    note: Folders shared with the network, semicolon-separated, as seen inside the container. Share something or other users may ban you.
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  First release in the Music Stack store. slskd 0.26.1 adds an option to set the
  MTU of the Soulseek server connection, enables logging to disk by default
  with 30 days of retention, and cancels downloads whose enqueue attempt times
  out.


  Full release notes: https://github.com/slskd/slskd/releases/tag/0.26.1
submitter: Bionded
submission: https://github.com/Bionded/umbrel-music-app-store
