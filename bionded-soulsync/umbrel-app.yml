path: ""
defaultUsername: ""
defaultPassword: ""
folderAccess:
  - id: soulsync-output
    name: SoulSync output
    note: Where SoulSync files finished, tagged music (/app/Transfer).
    mounts:
      - service: server
        targetPath: /app/Transfer
  - id: music
    name: Music
    note: Your music library. Available inside SoulSync at /music.
    mounts:
      - service: server
        targetPath: /music
permissions:
  - STORAGE_DOWNLOADS
