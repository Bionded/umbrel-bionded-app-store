    - heads up, behaviour change: if you sign people in with an auth proxy header (authelia, authentik, oauth2-proxy), soulsync now ignores that header until you…
    - open the player sits under the audio / video toggle in the sidebar, on both sides, and lives at /player. it's full screen over the manager, with its own…
    - home shows what you own: a billboard of new episodes and the newest films (a muted trailer if trailers are on), continue watching, your watchlist, top 10…


  Full release notes: https://github.com/Nezreka/SoulSync/releases/tag/3.6.9
