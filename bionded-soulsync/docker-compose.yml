version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-soulsync_server_1
      APP_PORT: 8008

  server:
    image: boulderbadgedad/soulsync:3.5.4@sha256:7433b8278d151f1e921aa5e104329dd89506fc9e858675385b12ed3c55d25add
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Etc/UTC
      - PYTHONPATH=/app
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${APP_DATA_DIR}/data/logs:/app/logs
      - ${APP_DATA_DIR}/data/db:/app/data
      - ${APP_DATA_DIR}/data/staging:/app/Staging
      - ${APP_DATA_DIR}/data/scripts:/app/scripts
      - ${APP_DATA_DIR}/data/music-videos:/app/MusicVideos
      - ${UMBREL_ROOT}/data/storage/downloads/music/slskd/complete:/app/downloads
      - ${UMBREL_ROOT}/data/storage/downloads/music/soulsync:/app/Transfer
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
