version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-soulsync_server_1
      APP_PORT: 8008

  server:
    image: boulderbadgedad/soulsync:3.6.0@sha256:518b1bbbe1153b40b5591943fd0f1e062d0b5215421c2332791a8ffcf3761f42
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Etc/UTC
      - PYTHONPATH=/app
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${APP_DATA_DIR}/data/logs:/app/logs
      - ${APP_DATA_DIR}/data/db:/app/data
      - ${APP_DATA_DIR}/data/staging:/app/Staging
      - ${APP_DATA_DIR}/data/scripts:/app/scripts
      - ${APP_DATA_DIR}/data/music-videos:/app/MusicVideos
      - ${UMBREL_ROOT}/data/storage/downloads:/app/downloads
      - ${UMBREL_ROOT}/data/storage/downloads/soulsync:/app/Transfer
      - ${UMBREL_ROOT}/data/storage/Music:/music
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
