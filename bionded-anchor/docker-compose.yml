version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-anchor_server_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/*"

  server:
    image: ghcr.io/zhfahim/anchor:0.18.1@sha256:83121433fcbc60f1491f1d5c761d2bac59519884ad31d0c464b7fce931d75d8e
    volumes:
      - ${APP_DATA_DIR}/data/anchor:/data
    restart: on-failure
