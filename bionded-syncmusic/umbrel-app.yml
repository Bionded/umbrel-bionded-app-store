releaseNotes: >-
  Libraries on other Umbrel apps now work by their internal address (e.g.
  http://navidrome_server_1:4533): SyncMusic runs in the host network, where
  those names do not resolve and the Umbrel's own IP is refused, so its HTTP
  traffic now goes through a small built-in proxy.


  Full release notes: https://github.com/Bionded/SyncMusic/releases/tag/v0.2.0
