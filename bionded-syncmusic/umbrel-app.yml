manifestVersion: 1
id: bionded-syncmusic
storage:
  dataRoot: data
category: media
name: SyncMusic (Experimental)
tagline: "EXPERIMENTAL: sync your library to iPods, Rockbox players and USB drives"
version: "0.2.0-patch.1"
port: 8766
description: >-
  ⚠️ EXPERIMENTAL. This app has full access to the hardware of your Umbrel: it
  runs privileged with every device (/dev) and the host network, because it has
  to detect, mount, format and write the USB players you plug in. That is the
  same as running as root on the Umbrel. SyncMusic only touches USB disks and
  has its own safety checks, but a container cannot protect your internal
  disks from it. Install it only if you accept that, and keep backups.


  SyncMusic keeps portable music players in sync with your media server. It
  copies music, podcasts and audiobooks from your libraries onto your devices,
  converting and tagging every file on the way, and sends what you listened to
  on the device (play counts, ratings, podcast and audiobook positions) back
  to the library.


  Libraries: Navidrome, a plain folder, Audiobookshelf and Jellyfin (beta).

  Devices: iPods with Apple's firmware (Classic, video, mini, nano 1G-4G),
  Rockbox players, HiBy R1, USB flash drives and memory cards (vfat, exFAT,
  ext4, NTFS), FTP servers, SMB shares and Android players over MTP (beta).

  Rules decide what goes onto a device (compatible with Navidrome smart
  playlists); processors transcode (e.g. FLAC to AAC/MP3), retag, add covers
  and lyrics.


  🎵 HOW IT WORKS WITH THE OTHER MUSIC APPS

  SyncMusic pulls your library from Navidrome (or Audiobookshelf, Jellyfin)
  and writes only to the players you plug in. Plugged-in
  players are mounted inside the app (under /run/syncmusic), not in the Umbrel
  Files app.


  🛠️ FIRST-RUN SETUP

  1. Libraries → Add library: Navidrome with URL
  http://navidrome_server_1:4533 and your Navidrome user and password
  (Audiobookshelf: http://audiobookshelf_web_1:80, Jellyfin:
  http://jellyfin_server_1:8096).

  2. Plug a player into a USB port of the Umbrel. It appears on the Dashboard as
  an unknown drive: register it (name, type, templates, processors).

  3. Adjust its rules, look at the plan and apply it. Eject the device from
  SyncMusic before unplugging it.


  Use internal addresses for other apps (http://<app>_server_1:<port>):
  SyncMusic reaches them through a small built-in proxy. umbrel.local and the
  Umbrel's IP do not work from inside this app.


  Works on amd64 and arm64.
