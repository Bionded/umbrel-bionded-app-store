category: media
name: AudioMuse-AI
tagline: Sonic analysis and smart playlists for your Navidrome library
version: "3.6.4"
port: 8044
description: >-
  AudioMuse-AI listens to your music. It analyses every track's sound (tempo,
  key, energy, mood, timbre) with local AI models, without relying on metadata or
  external APIs, then builds playlists that actually flow. Features include
  clustering into mood playlists, Similar Song, song paths from track A to track
  B, sonic "alchemy", a 2D music map, and text search ("calm piano at night").
  An optional LLM (Ollama, OpenAI-compatible, Gemini…) names playlists and
  powers a music chat.


  🎵 HOW IT WORKS WITH THE OTHER MUSIC APPS

  AudioMuse-AI reads your library through Navidrome's Subsonic API: it needs no
  access to your files and never changes them. Playlists it creates appear in
  Navidrome. With the AudioMuse-AI Navidrome plugin, Navidrome's Instant Mix and
  artist radio use AudioMuse's sonic similarity.


  🛠️ FIRST-RUN SETUP

  1. Open the app. The Setup Wizard starts: choose Navidrome, URL
  http://navidrome_server_1:4533, and your Navidrome username and password.

  2. In the authentication step, set the AudioMuse username and password (you
  can use the password umbrelOS shows for this app) and an API token (needed by
  the Navidrome plugin).

  3. Run a first analysis from the main page and let it finish before using the
  other features (this takes hours on a large library).


  🔌 NAVIDROME PLUGIN

  Download audiomuseai.ndp from
  github.com/NeptuneHub/AudioMuse-AI-NV-plugin/releases into Navidrome's
  /data/plugins folder and set these environment variables on Navidrome:
  ND_PLUGINS_ENABLED=true, ND_PLUGINS_AUTORELOAD=true,
  ND_AGENTS=audiomuseai,lastfm,deezer. In the plugin settings use
  http://bionded-audiomuse-ai_flask_1:8000 and your API token. Keep Navidrome,
  AudioMuse-AI and the plugin on their latest versions together; mismatches are
  the most common cause of errors.


  🖥️ EXTRA WORKERS ON OTHER COMPUTERS

  Analysis can be spread over more machines (for example a desktop with an
  NVIDIA GPU). Run the AudioMuse-AI image with the same version
  (3.6.3, or 3.6.3-nvidia for a GPU) and SERVICE_TYPE=worker, pointed at
  this Umbrel: POSTGRES_HOST=umbrel.local (or its IP), POSTGRES_PORT=54320,
  POSTGRES_USER=audiomuse, POSTGRES_DB=audiomusedb and POSTGRES_PASSWORD set
  to the password umbrelOS shows for this app. The worker gets the Navidrome
  address from AudioMuse's settings, so if you used
  http://navidrome_server_1:4533, give the worker the extra host
  navidrome_server_1 pointing at the Umbrel's IP.


  ⚠️ HARDWARE

  On amd64 (Intel/AMD) the CPU must support AVX2 (most CPUs since 2015; check
  for "avx2" in /proc/cpuinfo). arm64 (Raspberry Pi 5 and similar) is supported
  natively. Upstream recommends 4 cores and 8 GB of RAM. Analysis is
  CPU-heavy and can take hours on large libraries.


  Installs on its own; connect Navidrome (or Jellyfin, Plex, Emby, LMS, Lyrion) in the Setup Wizard. Works on amd64 (AVX2) and arm64.
