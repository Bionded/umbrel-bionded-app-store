version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bionded-audiomuse-ai_flask_1
      APP_PORT: 8000

  db:
    image: postgres:15.14-alpine@sha256:64583b3cb4f2010277bdd9749456de78e5c36f8956466ba14b0b96922e510950
    user: "1000:1000"
    environment:
      TZ: Etc/UTC
      POSTGRES_USER: audiomuse
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: audiomusedb
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiomuse -d audiomusedb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  flask:
    image: ghcr.io/neptunehub/audiomuse-ai:3.6.3@sha256:301b2d5c280f43c6e79823337455b6b7d575d7b8040a6f150266804350c51eab
    environment:
      SERVICE_TYPE: flask
      TZ: Etc/UTC
      POSTGRES_USER: audiomuse
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: audiomusedb
      POSTGRES_HOST: bionded-audiomuse-ai_db_1
      POSTGRES_PORT: "5432"
      TEMP_DIR: /app/temp_audio
    volumes:
      - ${APP_DATA_DIR}/data/temp-flask:/app/temp_audio
      - ${APP_DATA_DIR}/data/plugins-flask:/app/plugin/installed
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  worker:
    image: ghcr.io/neptunehub/audiomuse-ai:3.6.3@sha256:301b2d5c280f43c6e79823337455b6b7d575d7b8040a6f150266804350c51eab
    environment:
      SERVICE_TYPE: worker
      TZ: Etc/UTC
      POSTGRES_USER: audiomuse
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: audiomusedb
      POSTGRES_HOST: bionded-audiomuse-ai_db_1
      POSTGRES_PORT: "5432"
      TEMP_DIR: /app/temp_audio
    volumes:
      - ${APP_DATA_DIR}/data/temp-worker:/app/temp_audio
      - ${APP_DATA_DIR}/data/plugins-worker:/app/plugin/installed
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
